services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: american-dream-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - backend_uploads:/app/upload

volumes:
  backend_uploads:
